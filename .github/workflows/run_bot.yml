name: Run Wallpaper Bot

on:
  schedule:
    - cron: '0 7 * * *' # שעה 07:00 UTC שזה בדיוק 09:00 בבוקר שעון ישראל
  workflow_dispatch: # מאפשר להריץ ידנית מתי שתרצה

# הגדרת הרשאת כתיבה כדי שהבוט יוכל לעדכן את קובץ ההיסטוריה ולעשות פוש
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests Pillow

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: |
          python bot.py

