name: Run Wallpaper Bot

on:
  schedule:
    - cron: '0 10 * * *' # יריץ את הבוט כל יום בשעה 10:00 בבוקר (UTC)
  workflow_dispatch: # מאפשר לך להריץ ידנית מתי שתרצה

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: |
          python bot.py
